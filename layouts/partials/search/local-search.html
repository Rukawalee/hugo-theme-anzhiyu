<div id="local-search">
  <div class="search-dialog">
    <nav class="search-nav">
      <span class="search-dialog-title">{{ i18n "search.title" }}</span>
      <span id="loading-status"></span>
      <button class="search-close-button" type="button">
        <i class="anzhiyufont anzhiyu-icon-xmark"></i>
      </button>
    </nav>
    <div id="loading-database" class="is-center">
      <i class="anzhiyufont anzhiyu-icon-spinner anzhiyu-pulse-icon"></i>
      <span>  {{ i18n "search.load_data" }}</span>
    </div>
    <div class="search-wrap">
      <div id="local-search-input">
        <div class="local-search-box">
          <input class="local-search-box--input" type="text" placeholder="{{ i18n "search.local_search.input_placeholder" }}">
        </div>
      </div>
      <hr>
      <div id="local-search-results"></div>
    </div>
  </div>
  <div id="search-mask"></div>
</div>
