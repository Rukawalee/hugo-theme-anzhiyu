{{- /*
  {{< audio "https://.../a.mp3" >}}
*/ -}}
{{- $src := "" -}}
{{- if .IsNamedParams -}}
  {{- $src = .Get "src" | default (.Get "url") | default "" -}}
{{- else -}}
  {{- $src = trim (.Get 0 | default "") " " -}}
{{- end -}}
<div class="audio"><audio controls preload><source src="{{ $src | safeURL }}" type="audio/mp3">Your browser does not support the audio tag.</audio></div>
